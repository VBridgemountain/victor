<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VICTOR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>V.I.C.T.O.R. — NoirLab</title>
<style>
:root{
  --rgb:0,216,255;
  --accent:rgb(var(--rgb));
  --bg:#02060b;
  --text:color-mix(in srgb,var(--accent) 22%,#fff);
  --dim:color-mix(in srgb,var(--accent) 45%,#8a98a3);
  --line:rgba(var(--rgb),.32);
  --panel:rgba(var(--rgb),.055);
  --warn:#ff5a4d;
  --mono:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  background:
    radial-gradient(ellipse at 50% 50%,rgba(var(--rgb),.10),transparent 55%),
    radial-gradient(ellipse at 50% 120%,rgba(var(--rgb),.12),transparent 50%),
    var(--bg);
  color:var(--text);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  user-select:none;
}
body::after{ /* scanlines */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea{user-select:text}
#globe{position:fixed;inset:0;width:100%;height:100%;z-index:0;cursor:grab;touch-action:none}
body.dragging #globe,body.dragging .app{cursor:grabbing}

/* ---------- apps on the globe ---------- */
#apps{position:fixed;inset:0;z-index:1;pointer-events:none}
.app{
  position:absolute;left:0;top:0;width:62px;pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:none;border:0;padding:0;will-change:transform,opacity;touch-action:none;
}
.app .ico{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  font-size:25px;line-height:1;
  background:radial-gradient(circle at 50% 35%,rgba(var(--rgb),.28),rgba(2,6,11,.85) 70%);
  border:1px solid var(--line);
  box-shadow:0 0 14px rgba(var(--rgb),.25),inset 0 0 12px rgba(var(--rgb),.18);
  transition:box-shadow .2s,border-color .2s,transform .2s;
}
.app .ico img{width:40px;height:40px;border-radius:10px;pointer-events:none}
.app .lbl{
  font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  color:var(--text);text-shadow:0 0 8px rgba(var(--rgb),.9),0 0 2px #000;
}
.app:hover .ico,.app.focus .ico,.app:focus-visible .ico{
  border-color:var(--accent);transform:scale(1.12);
  box-shadow:0 0 26px rgba(var(--rgb),.75),inset 0 0 16px rgba(var(--rgb),.4);
}
.app:focus-visible{outline:none}

/* ---------- idéer (inuti globen) + översikt (flera globar) ---------- */
#ov{position:fixed;inset:0;z-index:1;pointer-events:none}
#ideas{position:fixed;left:50%;transform:translateX(-50%);z-index:1;width:min(780px,calc(100vw - 40px));pointer-events:none;
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start;overflow:hidden}
#apps,#ideas,.gl{--accent:rgb(var(--rgb));--line:rgba(var(--rgb),.32)}
.off>*{pointer-events:none!important}
.idea{position:relative;max-width:230px;pointer-events:auto;
  padding:9px 30px 9px 12px;background:rgba(2,8,14,.82);border:1px solid var(--line);color:var(--text);
  font-size:13px;line-height:1.35;overflow-wrap:anywhere;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.idea .ib{position:absolute;right:3px;top:6px}
.idea{cursor:pointer;transition:border-color .2s}
.idea:hover,.idea:focus-visible{border-color:var(--accent);outline:none}
.cnt{display:inline-block;margin-left:7px;font:10px var(--mono);color:var(--accent)}
/* mindmap: en idé i mitten, underidéerna i omlopp */
#mind{position:fixed;inset:0;z-index:1;pointer-events:none;--accent:rgb(var(--rgb));--line:rgba(var(--rgb),.32)}
.mnode{position:absolute;left:0;top:0;max-width:200px;pointer-events:auto;cursor:pointer;touch-action:none;
  padding:9px 14px;background:rgba(2,8,14,.88);border:1px solid var(--line);border-radius:18px;color:var(--text);
  font-size:13px;line-height:1.35;text-align:center;overflow-wrap:anywhere;transition:border-color .2s,box-shadow .2s}
.mnode:hover,.mnode:focus-visible{border-color:var(--accent);box-shadow:0 0 22px rgba(var(--rgb),.5);outline:none}
.mnode .ib{position:absolute;right:-7px;top:-9px;opacity:0;background:rgba(2,8,14,.95);border:1px solid var(--line);border-radius:50%;padding:3px 5px;font-size:11px}
.mnode:hover .ib,.mnode .ib:focus-visible{opacity:1}
.mtitle{position:absolute;left:0;top:0;max-width:300px;pointer-events:auto;text-align:center;cursor:text;user-select:text;outline:none;
  font:600 19px/1.25 "Segoe UI",system-ui,sans-serif;color:#fff;padding:24px 36px;overflow-wrap:anywhere;
  background:radial-gradient(closest-side,rgba(2,6,11,.82),rgba(2,6,11,0));text-shadow:0 0 14px rgba(var(--rgb),.9)}
#crumbs{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:6;display:none;gap:6px;align-items:center;flex-wrap:wrap;
  justify-content:center;width:max-content;max-width:calc(100vw - 40px);font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#crumbs.on{display:flex}
#crumbs button{background:none;border:0;color:var(--text);cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:3px 5px}
#crumbs button:hover,#crumbs button:focus-visible{color:#fff;text-shadow:0 0 8px var(--accent);outline:none}
#crumbs b{color:var(--accent)}
textarea.in{resize:vertical;line-height:1.45;font-family:inherit;display:block}
.gl{position:absolute;left:0;top:0;border-radius:50%;background:none;border:1px solid transparent;pointer-events:auto;
  cursor:pointer;padding:0;touch-action:none;transition:border-color .2s,box-shadow .2s}
.gl:hover,.gl:focus-visible,.gl.cur{border-color:var(--line);outline:none;
  box-shadow:0 0 30px rgba(var(--rgb),.25),inset 0 0 30px rgba(var(--rgb),.12)}
.gl .gname{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;text-align:center;
  font:600 12px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 0 10px rgba(var(--rgb),.9)}
.gl .gcount{display:block;font-weight:400;font-size:10px;color:var(--dim);letter-spacing:.16em;margin-top:3px}
.gl.far .gname{display:none}
#ovAdd{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);pointer-events:auto;z-index:200}
#ideaBar{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:6;width:min(460px,calc(100vw - 40px));display:none;gap:8px}
#ideaBar.on{display:flex}
#ideaBar .in{background:rgba(2,8,14,.85)}
#levels{position:fixed;right:22px;bottom:20px;z-index:6;display:flex;gap:4px}
#levels .hbtn{padding:6px 10px;font-size:10px}
.hbtn.on,.btn.on{background:rgba(var(--rgb),.34);color:#fff}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}

/* ---------- HUD chrome ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;gap:18px;
  padding:14px 22px;pointer-events:none}
#top>*{pointer-events:auto}
#logo{font:600 17px var(--mono);letter-spacing:.42em;color:var(--accent);text-shadow:0 0 14px rgba(var(--rgb),.8)}
#logo small{display:block;margin-top:2px;font:400 9px var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--dim);text-shadow:none}
.tagline{font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:0 0 14px}
#greet{font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{
  background:var(--panel);border:1px solid var(--line);color:var(--text);cursor:pointer;
  font:11px var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:8px 13px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  transition:background .15s,color .15s;
}
.hbtn:hover,.hbtn:focus-visible{background:rgba(var(--rgb),.22);color:#fff;outline:none}
#readout{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:2;pointer-events:none;
  font:11px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--dim);text-align:center;white-space:nowrap}
#readout b{color:var(--accent);font-weight:600;text-shadow:0 0 10px rgba(var(--rgb),.8)}
.corner{position:fixed;width:46px;height:46px;border:1px solid var(--line);z-index:2;pointer-events:none;opacity:.7}
.corner.tl{left:8px;top:8px;border-right:0;border-bottom:0}
.corner.tr{right:8px;top:8px;border-left:0;border-bottom:0}
.corner.bl{left:8px;bottom:8px;border-right:0;border-top:0}
.corner.br{right:8px;bottom:8px;border-left:0;border-top:0}

/* ---------- widgets ---------- */
#widgets{position:fixed;inset:0;z-index:5;pointer-events:none}
.widget{
  position:absolute;pointer-events:auto;width:270px;
  background:linear-gradient(180deg,rgba(var(--rgb),.09),rgba(var(--rgb),.03)),rgba(2,8,14,.72);
  border:1px solid var(--line);backdrop-filter:blur(6px);
  box-shadow:0 0 22px rgba(var(--rgb),.10),inset 0 0 30px rgba(var(--rgb),.04);
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  animation:wIn .35s ease-out;
}
@keyframes wIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.w-head{display:flex;align-items:center;gap:8px;padding:7px 8px 6px 16px;cursor:move;touch-action:none;
  border-bottom:1px solid rgba(var(--rgb),.18)}
.w-title{flex:1;font:10.5px var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.w-title::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:8px;
  box-shadow:0 0 8px var(--accent);animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.25}}
.ib{background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 6px;font-size:14px;line-height:1;border-radius:3px}
.ib:hover,.ib:focus-visible{color:#fff;background:rgba(var(--rgb),.22);outline:none}
.w-body{padding:11px 14px 14px}
.muted{color:var(--dim);font-size:12px}
.mono{font-family:var(--mono)}
.row{display:flex;align-items:center;gap:8px}
.in{
  width:100%;min-width:0;background:rgba(var(--rgb),.07);border:1px solid rgba(var(--rgb),.25);
  padding:6px 8px;color:var(--text);outline:none;border-radius:2px;
}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--rgb),.35)}
.in::placeholder{color:var(--dim);opacity:.75}
input[type=datetime-local].in{color-scheme:dark;font-size:12px}
.btn{background:rgba(var(--rgb),.16);border:1px solid var(--line);padding:6px 10px;cursor:pointer;white-space:nowrap;
  font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
.btn:hover,.btn:focus-visible{background:rgba(var(--rgb),.34);color:#fff;outline:none}
.btn.danger{border-color:rgba(255,90,77,.5);background:rgba(255,90,77,.12)}
.list{list-style:none;margin:0 0 9px;padding:0;max-height:210px;overflow:auto}
.list li{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px dashed rgba(var(--rgb),.14)}
.list li .ib{opacity:0}
.list li:hover .ib,.list li .ib:focus-visible{opacity:1}
.list::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{background:rgba(var(--rgb),.35)}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
/* clock */
.clock-t{font:300 46px/1 var(--mono);letter-spacing:.04em;color:#fff;text-shadow:0 0 18px rgba(var(--rgb),.75);font-variant-numeric:tabular-nums}
.clock-t small{font-size:20px;color:var(--accent);margin-left:4px}
.clock-d{margin-top:8px;font:12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
/* weather */
.wx-main{display:flex;align-items:center;gap:12px}
.wx-ico{font-size:40px;line-height:1;filter:drop-shadow(0 0 10px rgba(var(--rgb),.6))}
.wx-temp{font:300 38px/1 var(--mono);color:#fff;text-shadow:0 0 14px rgba(var(--rgb),.7)}
.wx-days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:11px}
.wx-day{border:1px solid rgba(var(--rgb),.18);padding:6px 4px;text-align:center;font:11px var(--mono)}
.wx-day .e{font-size:18px;display:block;margin:2px 0}
/* links */
.lnk{color:var(--text);text-decoration:none;display:block}
.lnk:hover,.lnk:focus-visible{color:#fff;text-shadow:0 0 8px var(--accent);outline:none}
.lnk::before{content:"▸ ";color:var(--accent)}
/* reminders */
.rem.done .grow{text-decoration:line-through;opacity:.45}
.rem.due .rt{color:var(--warn)}
.rt{display:block;font:10.5px var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.chk{appearance:none;width:15px;height:15px;border:1px solid var(--accent);cursor:pointer;flex:none;margin:0;display:grid;place-items:center}
.chk:checked::after{content:"";width:9px;height:9px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
/* notes */
.notes{width:100%;height:130px;resize:vertical;line-height:1.5}
/* system */
.bar{height:5px;background:rgba(var(--rgb),.14);margin:4px 0 9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);box-shadow:0 0 10px var(--accent);transition:width .6s}
.kv{display:flex;justify-content:space-between;font:11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.kv span:first-child{color:var(--dim)}
/* timer */
.tm{font:300 40px/1 var(--mono);color:#fff;text-shadow:0 0 14px rgba(var(--rgb),.7);font-variant-numeric:tabular-nums;margin-bottom:10px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(1,4,8,.62);backdrop-filter:blur(3px)}
#modal.open{display:grid}
.modal{width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 60px);display:flex;flex-direction:column;
  background:rgba(3,10,17,.96);border:1px solid var(--accent);box-shadow:0 0 50px rgba(var(--rgb),.3);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.modal-head{display:flex;align-items:center;padding:12px 12px 10px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{flex:1;margin:0;font:600 12px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.modal-body{padding:16px 20px 20px;overflow:auto}
.field{margin-bottom:16px}
.field>label,.flabel{display:block;font:10.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.swatches{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 12px currentColor}
.sw.on,.sw:focus-visible{border-color:#fff;outline:none}
input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.wpick{text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer}
.wpick:hover,.wpick:focus-visible{background:rgba(var(--rgb),.2);outline:none}
.wpick b{display:block;font:600 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.wpick .e{font-size:20px;float:right}
.arow{display:grid;grid-template-columns:52px 1fr 1.6fr auto;gap:7px;margin-bottom:7px}
.arow .in:first-child{text-align:center;font-size:17px;padding:3px}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:rgba(3,10,17,.95);border:1px solid var(--accent);padding:11px 16px;display:flex;gap:14px;align-items:center;
  box-shadow:0 0 30px rgba(var(--rgb),.45);font:12px var(--mono);letter-spacing:.1em;max-width:min(520px,90vw);animation:wIn .3s}
.toast b{color:var(--accent);letter-spacing:.2em}
/* ---------- telefon / smala fönster ---------- */
/* ---------- snabbknappar under globen ---------- */
#dock{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:6;display:flex;gap:24px;transition:opacity .25s}
#dock:empty{display:none}
body.lv2 #dock{opacity:0;pointer-events:none}
body.hasdock #ovAdd{bottom:138px}
.dk{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.dk .ico{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:22px;line-height:1;
  background:radial-gradient(circle at 50% 35%,rgba(var(--rgb),.28),rgba(2,6,11,.88) 70%);border:1px solid var(--line);
  box-shadow:0 0 14px rgba(var(--rgb),.25);transition:box-shadow .2s,border-color .2s}
.dk .lbl{font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.dk:hover .ico,.dk:focus-visible .ico,.dk:active .ico{border-color:var(--accent);box-shadow:0 0 22px rgba(var(--rgb),.7)}
.dk:focus-visible{outline:none}
/* ---------- appväljare ---------- */
.app.add .ico{border-style:dashed;font-size:28px;color:var(--accent)}
.plist{max-height:54vh;margin-top:10px}
.plist li{cursor:pointer;padding:7px 4px;gap:11px}
.plist li img{width:34px;height:34px;border-radius:8px;flex:none}
.plist li.sel{background:rgba(var(--rgb),.14)}
.plist li.sel .muted{color:var(--accent)}
.plist li:focus-visible{outline:1px solid var(--accent)}
.aimg{width:38px;height:38px;border-radius:9px;justify-self:center;align-self:center}
.arow .muted{align-self:center;font-size:11px}
#bDrawer{display:none}
@media (hover:none){.list li .ib,.mnode .ib{opacity:1}}
@media (max-width:760px){
  #top{flex-wrap:wrap;gap:7px;padding:calc(10px + env(safe-area-inset-top)) 12px 0}
  #logo{flex:1 0 100%;font-size:15px}
  #greet,#bFull,.corner{display:none}
  #bDrawer{display:block}
  .hbtn{padding:7px 9px;font-size:10px;letter-spacing:.1em}
  /* widgets ligger i en låda som fälls upp från nederkanten */
  #widgets{inset:auto 0 0 0;z-index:15;max-height:72vh;overflow:auto;pointer-events:auto;display:flex;flex-direction:column;gap:10px;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));background:rgba(2,8,14,.97);border-top:1px solid var(--accent);
    transform:translateY(105%);transition:transform .28s ease}
  body.wopen #widgets{transform:none}
  .widget{position:static;width:auto;flex:none;clip-path:none;animation:none}
  .w-head{cursor:default}
  #readout{bottom:calc(52px + env(safe-area-inset-bottom));width:calc(100vw - 24px);white-space:normal;font-size:10px;letter-spacing:.14em}
  #levels{right:50%;transform:translateX(50%);bottom:calc(12px + env(safe-area-inset-bottom))}
  #ideaBar{bottom:calc(92px + env(safe-area-inset-bottom))}
  #ovAdd{bottom:calc(104px + env(safe-area-inset-bottom))}
  #dock{bottom:calc(90px + env(safe-area-inset-bottom))}
  body.hasdock #ovAdd{bottom:calc(172px + env(safe-area-inset-bottom))}
  .arow .muted{display:none}
  #crumbs{top:calc(88px + env(safe-area-inset-top))}
  .mnode{max-width:124px;font-size:12px;padding:7px 10px}
  .mtitle{max-width:170px;font-size:15px;padding:16px 20px}
  .arow{grid-template-columns:44px 1fr auto}
  .arow .in:nth-child(3){grid-column:1 / 3;grid-row:2}
  .arow .btn{grid-column:3;grid-row:1}
  .toast{font-size:11px}
}
@media (prefers-reduced-motion:reduce){.widget,.toast{animation:none}.w-title::before{animation:none}}
</style>
</head>
<body>
<canvas id="globe"></canvas>
<div id="apps"></div><div id="ideas"></div><div id="ov"></div><div id="mind"></div>
<nav id="crumbs" aria-label="Var du är i mindmappen"></nav>

<script>
'use strict';
/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const TAU = Math.PI * 2;
const uid = () => Math.random().toString(36).slice(2, 9);
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null) e.append(c);
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* =====================================================================
   State (sparas i localStorage)
   ===================================================================== */
const KEY = 'jarvis-desktop-v1';
// Finns bara när sidan körs inne i Android-launchern: brygga till telefonens appar (se android/MainActivity.java)
const NATIVE = window.VictorNative || null;
const mkApp = (icon, name, url) => ({ id: uid(), icon, name, url });
const newGlobe = (name, color, apps, ideas) => ({ id: uid(), name: name || 'Ny glob', color: color || '', apps: apps || [], ideas: (ideas || []).map(t => typeof t === 'string' ? { id: uid(), text: t, children: [] } : t) });
const I = (text, ...children) => ({ id: uid(), text, children });   // en idé med underidéer
function defaults() {
  const W = innerWidth, H = innerHeight;
  return {
    name: '',
    theme: '#00d8ff',
    particles: NATIVE || innerWidth <= 760 ? 2400 : 4500,   // färre på telefon, för batteriets skull
    autoRotate: true,
    active: 0,
    globes: [
     newGlobe('Kreativitet', '#ff4fd8', [
      mkApp('🎨', 'Figma', 'https://www.figma.com'), mkApp('🖌️', 'Canva', 'https://www.canva.com'),
      mkApp('🖼️', 'Photopea', 'https://www.photopea.com'), mkApp('📌', 'Pinterest', 'https://www.pinterest.com'),
      mkApp('🎞️', 'CapCut', 'https://www.capcut.com'), mkApp('🎹', 'BandLab', 'https://www.bandlab.com') ]),
     newGlobe('AI & utveckling', '#00ffa2', [
      mkApp('🤖', 'Claude', 'https://claude.ai'), mkApp('🐙', 'GitHub', 'https://github.com'),
      mkApp('💻', 'VS Code', 'vscode:'), mkApp('🚂', 'Railway', 'https://railway.app'),
      mkApp('⚡', 'Supabase', 'https://supabase.com/dashboard'), mkApp('💳', 'Stripe', 'https://dashboard.stripe.com'),
      mkApp('📚', 'MDN', 'https://developer.mozilla.org') ]),
     newGlobe('Spel', '#ff7a1a', [
      mkApp('🎮', 'Steam', 'steam://open/main'), mkApp('💬', 'Discord', 'discord://'),
      mkApp('📺', 'Twitch', 'https://www.twitch.tv'), mkApp('🕹️', 'Epic', 'com.epicgames.launcher://'),
      mkApp('❎', 'Xbox', 'xbox:') ]),
     newGlobe('Brainstorm', '#ffb300', [
      mkApp('✏️', 'Excalidraw', 'https://excalidraw.com'), mkApp('🧩', 'Miro', 'https://miro.com'),
      mkApp('🗒️', 'Notion', 'https://www.notion.so'), mkApp('🧠', 'tldraw', 'https://www.tldraw.com') ],
      [I('Hemsida', I('Webshop',
          I('Vad ska den innehålla?', I('Kläder'), I('Kamerautrustning'), I('Filminspelningssaker'), I('Väskor')),
          I('Betalning', I('Med vad?'), I('Hur?')))),
       'Klicka på en idé för att zooma in i den']),
     { id: uid(), name: 'Vardag', color: '', ideas: [], apps: [
      { id: uid(), icon: '▶️', name: 'YouTube',  url: 'https://www.youtube.com' },
      { id: uid(), icon: '✉️', name: 'Gmail',    url: 'https://mail.google.com' },
      { id: uid(), icon: '📅', name: 'Kalender', url: 'https://calendar.google.com' },
      { id: uid(), icon: '🎵', name: 'Spotify',  url: 'spotify:' },
      { id: uid(), icon: '🐙', name: 'GitHub',   url: 'https://github.com' },
      { id: uid(), icon: '🗺️', name: 'Kartor',   url: 'https://maps.google.com' },
      { id: uid(), icon: '🤖', name: 'Claude',   url: 'https://claude.ai' },
      { id: uid(), icon: '💻', name: 'VS Code',  url: 'vscode:' },
      { id: uid(), icon: '⚙️', name: 'Windows',  url: 'ms-settings:' },
      { id: uid(), icon: '🧮', name: 'Kalkyl',   url: 'calculator:' },
      { id: uid(), icon: '🎬', name: 'Netflix',  url: 'https://www.netflix.com' },
      { id: uid(), icon: '📁', name: 'Drive',    url: 'https://drive.google.com' },
     ] },
    ],
    reminders: [],
    widgets: [
      { id: uid(), type: 'clock',     x: 26, y: 76, data: {} },
      { id: uid(), type: 'weather',   x: 26, y: 232, data: { name: 'Stockholm', lat: 59.33, lon: 18.07 } },
      { id: uid(), type: 'system',    x: 26, y: Math.max(470, H - 230), data: {} },
      { id: uid(), type: 'reminders', x: W - 296, y: 76, data: {} },
      { id: uid(), type: 'links',     x: W - 296, y: 350, data: { links: [
          { name: 'Nyheter — SVT', url: 'https://www.svt.se' },
          { name: 'Wikipedia', url: 'https://sv.wikipedia.org' } ] } },
    ],
  };
}
let state, firstRun = false;
try { firstRun = !localStorage.getItem(KEY); } catch {}
try {
  const s = JSON.parse(localStorage.getItem(KEY) || '{}');
  state = Object.assign(defaults(), s);
  if (s.apps && !s.globes) state.globes[state.globes.length - 1].apps = s.apps;   // äldre sparformat
  delete state.apps;
  if (!Array.isArray(state.globes) || !state.globes.length) state.globes = defaults().globes;
} catch { state = defaults(); }
// i launchern byggs globarna av telefonens egna appar; bara Brainstorm-globen följer med från standarduppsättningen
if (NATIVE && firstRun) { state.globes = state.globes.filter(g => g.name === 'Brainstorm'); state.active = 0; }
// snabbknapparna under globen: på i launchern, av på webben tills man väljer dem
if (!Array.isArray(state.dock)) state.dock = NATIVE ? ['phone', 'camera', 'web'] : [];
const G = () => state.globes[state.active] || state.globes[state.active = 0];
const hexRgb = h => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); if (!m) return null;
  const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} }, 150);
}

/* =====================================================================
   Tema
   ===================================================================== */
let RGB = [0, 216, 255];
function setTheme(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex); if (!m) return;
  const n = parseInt(m[1], 16);
  RGB = [n >> 16, (n >> 8) & 255, n & 255];
  document.documentElement.style.setProperty('--rgb', RGB.join(','));
  state.theme = '#' + m[1].toLowerCase(); save();
}
setTheme(state.theme);

/* =====================================================================
   Partikelglob
   ===================================================================== */
const cv = $('#globe'), ctx = cv.getContext('2d');
let W = 0, H = 0, CX = 0, CY = 0, R = 200, zoom = 1, zt = 1;   // zoom: 0.3 = översikt, 1 = glob, 2.6 = inuti
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function slot(j) {   // globens plats i översikten
  const n = state.globes.length; if (n === 1) return { x: W / 2, y: H / 2 };
  const a = -Math.PI / 2 + j * TAU / n;
  return { x: W / 2 + Math.cos(a) * Math.min(W * 0.34, H * 0.55), y: H / 2 - 6 + Math.sin(a) * H * 0.26 };
}
const FOCAL = 3.2, APP_R = 1.2;
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', () => {
  const oldW = W; resize();
  // widgets på högra halvan följer med högerkanten när fönstret ändrar storlek
  if (isMobile()) return;   // på telefon ligger widgets i lådan och har ingen egen position
  for (const { w, node } of mounted.values()) if (w.x + node.offsetWidth / 2 > oldW / 2) w.x += W - oldW;
  clampWidgets(); save();
});

// rotationsmatris (rad-ordning)
let M = [1, 0, 0, 0, 1, 0, 0, 0, 1];
function rotate(ax, ay) {
  const c1 = Math.cos(ay), s1 = Math.sin(ay), c2 = Math.cos(ax), s2 = Math.sin(ax);
  const A = [c1, 0, s1, s2 * s1, c2, -s2 * c1, -c2 * s1, s2, c2 * c1]; // Rx·Ry
  const m = M, o = new Array(9);
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    o[r * 3 + c] = A[r * 3] * m[c] + A[r * 3 + 1] * m[3 + c] + A[r * 3 + 2] * m[6 + c];
  M = o;
}
function orthonormalize() {
  const m = M;
  let l = Math.hypot(m[0], m[1], m[2]); m[0] /= l; m[1] /= l; m[2] /= l;
  let d = m[0] * m[3] + m[1] * m[4] + m[2] * m[5];
  m[3] -= d * m[0]; m[4] -= d * m[1]; m[5] -= d * m[2];
  l = Math.hypot(m[3], m[4], m[5]); m[3] /= l; m[4] /= l; m[5] /= l;
  m[6] = m[1] * m[5] - m[2] * m[4]; m[7] = m[2] * m[3] - m[0] * m[5]; m[8] = m[0] * m[4] - m[1] * m[3];
}
rotate(-0.35, 0.5);

let N = 0, P = null; // partikeldata
let NC = 0, CL = null, cloudE = 0, cloudW = 0; // stoftmolnet i översikten
function initParticles() {
  N = state.particles | 0;
  const f = () => new Float32Array(N);
  P = { bx: f(), by: f(), bz: f(), rf: f(), px: f(), py: f(), pz: f(), vx: f(), vy: f(), vz: f(),
        k: f(), ph: f(), sz: f(), sx: f(), sy: f(), br: f(), tw: f(), cg: new Uint8Array(N), star: new Uint8Array(N) };
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i + 0.5) * 2 / N, r = Math.sqrt(1 - y * y), th = i * golden;
    P.bx[i] = Math.cos(th) * r; P.by[i] = y; P.bz[i] = Math.sin(th) * r;
    const u = Math.random();
    // stjärnstoft: ett luddigt skal, en gles halo utanför och lite damm inuti
    P.rf[i] = u < 0.76 ? 1 + (Math.random() + Math.random() - 1) * 0.075
            : u < 0.93 ? 1.04 + Math.pow(Math.random(), 2) * 0.5 : 0.3 + Math.random() * 0.6;
    P.k[i] = 0.03 + Math.random() * 0.12;
    P.ph[i] = Math.random() * TAU;
    P.sz[i] = 0.6 + Math.pow(Math.random(), 3) * 1.7;             // de flesta mycket fina, några få större korn
    P.br[i] = 0.55 + Math.random() * 0.45;                        // egen ljusstyrka
    P.tw[i] = 0.5 + Math.random() * 2.8;                          // glimmerhastighet
    const c = Math.random(); P.cg[i] = c < 0.6 ? 0 : c < 0.86 ? 1 : 2;   // temafärg / vitare / varm ton
    P.star[i] = Math.random() < 0.014 ? 1 : 0;                   // enstaka lysande stjärnor
    // startar utspridda och "samlas" till en glob
    const a = Math.random() * TAU, b = Math.acos(2 * Math.random() - 1), d = 2.5 + Math.random() * 3;
    P.px[i] = Math.sin(b) * Math.cos(a) * d; P.py[i] = Math.sin(b) * Math.sin(a) * d; P.pz[i] = Math.cos(b) * d * 0.4;
    P.sx[i] = NaN;
  }
  // stoftmolnet i hjulets mitt (syns i översikten): tätast i kärnan, glesare utåt
  NC = Math.round(clamp(N * 0.9, 900, 3000));
  const h = () => new Float32Array(NC);
  CL = { a: h(), r: h(), y: h(), ph: h(), sz: h(), br: h(), tw: h(), cg: new Uint8Array(NC), star: new Uint8Array(NC) };
  for (let i = 0; i < NC; i++) {
    const th = Math.random() * TAU, v = 2 * Math.random() - 1, hr = Math.sqrt(1 - v * v), r = Math.pow(Math.random(), 0.8) * 1.25;
    CL.a[i] = th; CL.r[i] = r * hr; CL.y[i] = r * v * 0.62;
    CL.ph[i] = Math.random() * TAU;
    CL.sz[i] = 0.7 + Math.pow(Math.random(), 3) * 2.2;
    CL.br[i] = (0.5 + Math.random() * 0.5) * (1 - 0.8 * Math.pow(Math.min(r / 1.25, 1), 2));
    CL.tw[i] = 0.4 + Math.random() * 2.4;
    const c = Math.random(); CL.cg[i] = c < 0.55 ? 0 : c < 0.85 ? 1 : 2;
    CL.star[i] = Math.random() < 0.02 ? 1 : 0;
  }
}

// interaktion
let dragging = false, moved = 0, lastX = 0, lastY = 0, pendX = 0, pendY = 0;
let velX = 0, velY = 0, energy = 0, mouseX = -9999, mouseY = -9999, hoverApp = false, ringA = 0, T = 0;
const isMobile = () => innerWidth <= 760;
const touches = new Map(); let pinchD = 0;   // aktiva fingrar, för nypzoom
function onDown(e) {
  if (e.button !== 0) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinchD = 0;
  document.body.classList.remove('wopen');
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; pendX = pendY = 0; wheel0 = wheel; gridVel = 0;
  document.body.classList.add('dragging');
}
cv.addEventListener('pointerdown', onDown);
addEventListener('pointermove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size >= 2) {   // två fingrar: nyp för att zooma
    const [a, b] = [...touches.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = pinchD ? d / pinchD : 1;
    if (!pinchD) pinchD = d; else if (r > 1.06 || r < 0.94) { zoomBy(r); pinchD = d; }
    moved += 10; lastX = e.clientX; lastY = e.clientY; return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  if (level === 0) { pendW -= dx * 1.8 * state.globes.length / (TAU * ovRx()); return; }   // översikt: snurra hjulet
  if (level === 2 && !path.length && gridMax > 0) { gridScroll = clamp(gridScroll - dy, 0, gridMax); gridVel = -dy; return; }   // inuti: scrolla apparna
  pendY += dx * 0.0055; pendX -= dy * 0.0055;
});
const endDrag = e => {
  touches.delete(e.pointerId); pinchD = 0;
  if (e.pointerType !== 'mouse') mouseX = mouseY = -9999;
  if (dragging && level === 0) {   // översikt: snäpp till nästa glob i dragriktningen
    const w = wheel + pendW, d = w - wheel0;
    wheel = w; pendW = 0; wheelT = d > 0.15 ? Math.ceil(w) : d < -0.15 ? Math.floor(w) : Math.round(w);
  }
  dragging = false; document.body.classList.remove('dragging');
};
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
document.addEventListener('pointerleave', () => { mouseX = mouseY = -9999; });
let snapAt = 0;
function zoomBy(f) {   // f > 1 zoomar in. Snäpper mellan översikt ↔ glob ↔ inuti.
  if (performance.now() - snapAt < 450) return;
  if (path.length) {   // i mindmappen: scrolla ut backar en nivå
    if (f < 1) { setPath(path.slice(0, -1), -0.4); snapAt = performance.now(); }
    return;
  }
  let z = zt * f, snap = true;
  if (f < 1) { if (zt > 1.5 && z < 2.2) z = 1; else if (z < 0.62) z = 0.3; else snap = false; }
  else { if (zt < 0.62) { z = 1; enterGlobe(frontGlobe()); } else if (z > 1.5) z = 2.6; else snap = false; }
  if (snap && z !== zt) snapAt = performance.now();
  zt = clamp(z, 0.3, 2.6);
}
addEventListener('wheel', e => {
  if (e.target.closest('.widget,#modal,#top,#ideaBar')) return;
  e.preventDefault();
  if (level === 2 && !path.length && gridMax > 0) {   // inuti med många appar: hjulet scrollar först, zoomar ut först vid kanten
    const to = clamp(gridScroll + clamp(e.deltaY, -150, 150), 0, gridMax), now = performance.now();
    if (to !== gridScroll) { gridScroll = to; gridVel = 0; gridWheelAt = now; return; }
    if (now - gridWheelAt < 500) { gridWheelAt = now; return; }
  }
  zoomBy(Math.exp(clamp(-e.deltaY, -150, 150) * 0.0012));
}, { passive: false });
function kick(s) { for (let i = 0; i < N; i++) { P.vx[i] += (Math.random() - .5) * s; P.vy[i] += (Math.random() - .5) * s; P.vz[i] += (Math.random() - .5) * s; } }
let wheel = state.active, pendW = 0, wheelT = null, wheel0 = 0; const bgHits = [];
const ovRx = () => W <= 760 ? W * 0.43 : Math.min(W * 0.36, Math.min(W, H) * 0.7);   // hjulets radie i översikten
const frontGlobe = () => { const n = state.globes.length; return ((Math.round(wheel) % n) + n) % n; };
cv.addEventListener('click', e => {   // klick på en bakgrundsglob byter till den
  if (moved >= 7 || level !== 1) return;
  for (const h of bgHits) if (Math.hypot(e.clientX - h.x, e.clientY - h.y) < h.r) { enterGlobe(h.j); break; }
});
function enterGlobe(j) {
  if (path.length) setPath([], 0);
  if (j !== state.active) { state.active = j; gridScroll = 0; save(); buildScene(); kick(0.25); }
  zt = 1;
}
addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
  if (level === 0 && e.key === 'ArrowLeft') wheelT = Math.round(wheelT == null ? wheel : wheelT) - 1;
  else if (level === 0 && e.key === 'ArrowRight') wheelT = Math.round(wheelT == null ? wheel : wheelT) + 1;
  else if (level === 0 && e.key === 'Enter' && !e.target.closest('button')) enterGlobe(frontGlobe());
  else if (e.key === 'ArrowLeft') velY = -0.04; else if (e.key === 'ArrowRight') velY = 0.04;
  else if (e.key === 'ArrowUp') velX = 0.04; else if (e.key === 'ArrowDown') velX = -0.04;
  else if (e.key === '+') zoomBy(1.15); else if (e.key === '-') zoomBy(0.87);
  else if (e.key === 'PageDown' || e.key === 'PageUp') { const n = state.globes.length;
    e.preventDefault(); enterGlobe((state.active + (e.key === 'PageDown' ? 1 : n - 1)) % n); }
});

// appnoder
const appsEl = $('#apps'), ideasEl = $('#ideas'), ovEl = $('#ov'), readout = $('#readout'), ideaBar = $('#ideaBar'),
      mindEl = $('#mind'), crumbs = $('#crumbs');
const IDEA_R = 0.4;
let appNodes = [], ideaNodes = [], ovNodes = [], ACT = null, level = -1;
// brainstorm: path = vägen av idéer man zoomat in genom, im = hur mycket mindmap-vyn syns (0–1)
let path = [], mindNodes = [], mindTitle = null, im = 0, burst = 0, orbit = 0;
// scrollning i apprutnätet inuti en glob
let gridScroll = 0, gridMax = 0, gridVel = 0, gridWheelAt = 0;
const fib = (i, n) => { const y = 1 - (i + 0.5) * 2 / n, r = Math.sqrt(1 - y * y), th = i * Math.PI * (3 - Math.sqrt(5));
  return [Math.cos(th) * r, y, Math.sin(th) * r]; };
const MB = []; for (let i = 0; i < 520; i++) MB.push(...fib(i, 520));   // punkter för miniglober
// Datorbryggan: ett litet hjälpprogram på Windows-datorn (desktop/helper) som låter sidan se installerade program,
// starta dem och visa öppna fönster. Den svarar bara på den egna datorn och kräver kopplingskoden.
const HELPER = 'http://127.0.0.1:8770';
let helperOk = false;
const hTok = () => (!NATIVE && state.helper && state.helper.token) || '';
async function helper(path, data) {
  const r = await fetch(HELPER + path, { method: data ? 'POST' : 'GET', cache: 'no-store', body: data ? JSON.stringify(data) : undefined,
    headers: Object.assign({ Authorization: 'Bearer ' + hTok() }, data ? { 'Content-Type': 'application/json' } : {}) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Datorbryggan svarade inte.');

    el('p', { style: 'margin-top:0', text: 'En webbsida kan inte se datorns program själv. Datorbryggan är ett litet hjälpprogram som körs på din Windows-dator och låter V.I.C.T.O.R. visa installerade program, starta dem och se vilka fönster som är öppna.' }),
    step('1', 'Installera Node.js om du inte har det (nodejs.org).'),
    step('2', 'Hämta mappen ', el('a', { class: 'lnk', href: 'https://github.com/VBridgemountain/victor/tree/main/desktop/helper', target: '_blank', rel: 'noopener', text: 'desktop/helper' }), ' och dubbelklicka på starta-brygga.cmd.'),
    step('3', 'Öppna ', el('a', { class: 'lnk', href: HELPER, target: '_blank', rel: 'noopener', text: '127.0.0.1:8770' }), ' på datorn, kopiera kopplingskoden och klistra in den här.'),
    el('form', { class: 'row', style: 'margin-top:12px', onsubmit: async e => { e.preventDefault(); state.helper = { token: t.value.trim() }; save();
        msg.textContent = 'Ansluter…';
        if (await helperConnect()) { buildScene(); refresh('running'); toast('DATORBRYGGA', 'Ansluten.'); if (then) then(); else closeModal(); }
        else msg.textContent = 'Ingen kontakt. Kontrollera att bryggan är igång på den här datorn och att koden stämmer.'; } },
      t, el('button', { class: 'btn', text: 'Anslut' })), msg,
    el('p', { class: 'muted', text: 'Bryggan svarar bara den här datorn, och bara V.I.C.T.O.R. med rätt kod. Den kan starta program från Start-menyn och lyfta fram fönster, inget annat.' })));
  t.focus();
}
function openPicker(gi) {
  const g = state.globes[gi], all = nativeApps();
  const list = el('ul', { class: 'list plist' });
  const q = el('input', { class: 'in', placeholder: 'Sök bland telefonens appar…', 'aria-label': 'Sök app', oninput: () => draw() });
  const toggle = a => {
    const cur = globeOf(a.pkg);
    if (cur) cur.apps = cur.apps.filter(x => x.pkg !== a.pkg);
    if (cur === g) hidePkg(a.pkg);                                   // togs bort härifrån: ska inte sorteras in automatiskt igen
    else { g.apps.push({ id: uid(), icon: '', name: a.label, url: '', pkg: a.pkg }); unhidePkg(a.pkg); }
    save(); buildScene(); draw();
  };
  function draw() {
    const t = q.value.trim().toLowerCase(), hits = all.filter(a => a.label.toLowerCase().includes(t)), keep = list.scrollTop;
    list.textContent = '';
    if (!hits.length) list.append(el('li', { class: 'muted', text: 'Inga appar matchar.' }));
    for (const a of hits) {
      const cur = globeOf(a.pkg), here = cur === g;
      list.append(el('li', { class: here ? 'sel' : '', role: 'button', tabIndex: 0, 'aria-pressed': here,
        onclick: () => toggle(a), onkeydown: e => { if (e.key === 'Enter') toggle(a); } },
        el('img', { src: '/icon/' + a.pkg, alt: '', loading: 'lazy' }), el('span', { class: 'grow', text: a.label }),
        el('span', { class: 'muted', text: here ? '✓ i globen' : cur ? cur.name : 'inte tillagd' })));
    }
    list.scrollTop = keep;
  }
  draw();
  openModal('Appar i ' + g.name, el('div', {},
    el('p', { class: 'muted', style: 'margin-top:0', text: 'Tryck på en app för att lägga den i globen. Tryck igen för att ta bort den. En app som ligger i en annan glob flyttas hit.' }),
    q, list, el('button', { class: 'btn on', style: 'margin-top:4px', text: 'Klar', onclick: closeModal })));
}

function openApps(gi) {
  if (typeof gi !== 'number') gi = state.active;
  const wrap = el('div'), changed = () => { save(); buildScene(); };
  const draw = () => {
    const g = state.globes[gi]; wrap.textContent = '';
    wrap.append(el('div', { class: 'gtabs' },
      state.globes.map((x, i) => el('button', { class: 'btn' + (i === gi ? ' on' : ''), text: x.name, onclick: () => { gi = i; draw(); } })),
      el('button', { class: 'btn', text: '+ Ny glob', onclick: () => { state.globes.push(newGlobe()); gi = state.globes.length - 1; changed(); draw(); } })));
    wrap.append(el('div', { class: 'field' }, el('label', { for: 'gName', text: 'Globens namn' }),
      el('div', { class: 'row' },
        el('input', { id: 'gName', class: 'in', value: g.name, onchange: e => { g.name = e.target.value.trim() || 'Glob'; changed(); draw(); } }),
        state.globes.length > 1 ? el('button', { class: 'btn danger', text: 'Ta bort glob', onclick: () => {
          if (!confirm('Ta bort globen "' + g.name + '" med alla dess appar och idéer?')) return;
          state.globes.splice(gi, 1); state.active = clamp(state.active > gi ? state.active - 1 : state.active, 0, state.globes.length - 1);
          gi = Math.min(gi, state.globes.length - 1); changed(); draw(); } }) : null)));
    // Globens egen färg: färgrutor som fungerar överallt (Androids WebView har ingen färgväljare), plus egen färg där den finns
    const setCol = c => { g.color = c; changed(); draw(); };
    wrap.append(el('div', { class: 'field' }, el('label', { text: 'Globens färg' }),
      el('div', { class: 'swatches' },
        PRESETS.concat(['#ffe94d', '#9dff3d', '#00c9a7', '#ff8fa3']).map(c => el('button', { class: 'sw' + ((g.color || '').toLowerCase() === c ? ' on' : ''),
          style: `background:${c};color:${c}`, 'aria-label': 'Färg ' + c, onclick: () => setCol(c) })),
        NATIVE ? null : el('input', { type: 'color', value: g.color || state.theme, 'aria-label': 'Egen färg', onchange: e => setCol(e.target.value) }),
        el('button', { class: 'btn' + (g.color ? '' : ' on'), text: 'Följ tema', onclick: () => setCol('') }))));
    wrap.append(el('span', { class: 'flabel', text: 'Appar i globen' }));
    if (NATIVE) wrap.append(el('button', { class: 'btn on', style: 'margin-bottom:12px', text: '+ Lägg till appar från telefonen',
      onclick: () => openPicker(gi) }));
    else wrap.append(el('button', { class: 'btn on', style: 'margin-bottom:12px', text: '+ Lägg till program från datorn', onclick: () => openProgPicker(gi) }),
      el('p', { class: 'muted', style: 'margin-top:0', text:
      'Webbadresser öppnas i ny flik. Installerade program startas med sitt protokoll, t.ex. spotify:  vscode:  ms-settings:  calculator:  steam://  discord://' }));
    g.apps.forEach((a, i) => {
      const f = (key, ph) => el('input', { class: 'in', value: a[key] || '', placeholder: ph, 'aria-label': ph,
        onchange: e => { a[key] = e.target.value.trim(); changed(); } });
      const del = el('button', { class: 'btn danger', text: '✕', 'aria-label': 'Ta bort ' + a.name, onclick: () => {
        if (a.pkg) hidePkg(a.pkg); g.apps.splice(i, 1); changed(); draw(); } });
      wrap.append(a.pkg && NATIVE   // telefonapp: ikon och namn räcker
        ? el('div', { class: 'arow' }, el('img', { class: 'aimg', src: '/icon/' + a.pkg, alt: '' }), f('name', 'Namn'), el('span', { class: 'muted', text: 'Telefonapp' }), del)
        : a.prog ? el('div', { class: 'arow' }, el('img', { class: 'aimg', src: progIcon(a.prog), alt: '', onerror: e => e.target.style.visibility = 'hidden' }), f('name', 'Namn'), el('span', { class: 'muted', text: 'Program' }), del)
        : el('div', { class: 'arow' }, f('icon', 'Ikon'), f('name', 'Namn'), f('url', 'Adress eller protokoll'), del));
    });
    wrap.append(el('button', { class: 'btn', style: 'margin-top:6px', text: NATIVE ? '+ Lägg till webblänk' : '+ Lägg till app', onclick: () => {
      g.apps.push(mkApp('✨', 'Ny app', 'https://')); changed(); draw();
      const rows = wrap.querySelectorAll('.arow'); rows[rows.length - 1].children[1].select(); } }));
  };
  draw(); openModal('Glober och appar', wrap);
}
$('#bApps').onclick = () => openApps();
$('#bDrawer').onclick = () => document.body.classList.toggle('wopen');

/* ---------- Sök bland alla appar i alla globar ---------- */
function openSearch() {
  const all = [];
  state.globes.forEach(g => g.apps.forEach(a => { if (!NATIVE || !a.pkg) all.push({ a, g }); }));
  // i launchern söker man bland alla telefonens appar, även de som inte ligger i någon glob
  if (NATIVE) nativeApps().forEach(a => all.push({ a: { name: a.label, pkg: a.pkg }, g: globeOf(a.pkg) || { name: '' } }));
  all.sort((x, y) => x.a.name.localeCompare(y.a.name, 'sv'));
  const list = el('ul', { class: 'list', style: 'max-height:52vh;margin-top:10px' });
  const q = el('input', { class: 'in', placeholder: 'Sök bland alla appar…', 'aria-label': 'Sök app', oninput: () => draw(),
    onkeydown: e => { if (e.key === 'Enter') { const first = list.querySelector('a'); if (first) first.click(); } } });
  function draw() {
    const t = q.value.trim().toLowerCase(), hits = all.filter(x => x.a.name.toLowerCase().includes(t));
    list.textContent = '';
    if (!hits.length) list.append(el('li', { class: 'muted', text: 'Inga appar matchar.' }));
    hits.slice(0, 100).forEach(x => list.append(el('li', {},
      el('a', { class: 'lnk grow', href: '#', text: x.a.name, onclick: e => { e.preventDefault(); closeModal(); openApp(x.a); } }),
      el('span', { class: 'muted', text: x.g.name }))));
  }
  draw(); openModal('Sök app', el('div', {}, q, list)); q.focus();
}
$('#bSearch').onclick = openSearch;

/* ---------- Android-launchern: telefonens appar sorteras in i globar ---------- */
// Androids appkategorier → globar. Appar utan kategori hamnar i bokstavsglober.
const CATS = { 0: 'Spel', 1: 'Media', 2: 'Media', 3: 'Media', 4: 'Socialt', 5: 'Socialt', 6: 'Resor & kartor', 7: 'Produktivitet' };
const CAT_COLORS = { 'Spel': '#ff7a1a', 'Media': '#ff4fd8', 'Socialt': '#3d8bff', 'Resor & kartor': '#00ffa2', 'Produktivitet': '#a66bff', 'Nya appar': '#e8f4ff' };
const PER_GLOBE = 14;
function syncNativeApps(first) {   // returnerar true om något ändrades
  let list; try { list = JSON.parse(NATIVE.getApps()); } catch { return false; }
  if (!Array.isArray(list) || !list.length) return false;
  list.sort((a, b) => a.label.localeCompare(b.label, 'sv'));
  const installed = new Set(list.map(a => a.pkg)), have = new Set(); let changed = false;
  for (const g of state.globes) {   // ta bort avinstallerade, notera vilka som redan ligger i en glob
    const keep = (g.apps || []).filter(a => !a.pkg || installed.has(a.pkg));
    if (keep.length !== (g.apps || []).length) changed = true;
    g.apps = keep; keep.forEach(a => a.pkg && have.add(a.pkg));
  }
  const globeFor = name => state.globes.find(g => g.name === name) || state.globes[state.globes.push(newGlobe(name, CAT_COLORS[name])) - 1];
  const rest = [];
  for (const a of list) {
    if (have.has(a.pkg) || (state.hidden || []).includes(a.pkg)) continue;   // redan placerad, eller borttagen av användaren
    const app = { id: uid(), icon: '', name: a.label, url: '', pkg: a.pkg }; changed = true;
    if (CATS[a.cat]) globeFor(CATS[a.cat]).apps.push(app); else rest.push(app);
  }
  if (first) for (let i = 0; i < rest.length; i += PER_GLOBE) {
    const chunk = rest.slice(i, i + PER_GLOBE), a = chunk[0].name[0].toUpperCase(), b = chunk[chunk.length - 1].name[0].toUpperCase();
    state.globes.push(newGlobe('Appar ' + (a === b ? a : a + '–' + b), '', chunk));
  } else rest.forEach(app => globeFor('Nya appar').apps.push(app));   // appar som installerats senare
  if (changed) save();
  return changed;
}
if (NATIVE) {
  // bakåtknappen backar en nivå i stället för att stänga startskärmen
  window.nativeBack = () => {
    if (modal.classList.contains('open')) closeModal();
    else if (document.body.classList.contains('wopen')) document.body.classList.remove('wopen');
    else if (path.length) setPath(path.slice(0, -1), -0.4);
    else if (level === 2) zt = 1;
    else if (level === 1) zt = 0.3;
  };
  // hemknappen går alltid till glob-vyn
  window.nativeHome = () => { closeModal(); document.body.classList.remove('wopen'); if (path.length) setPath([], -0.4); if (level === 0) enterGlobe(frontGlobe()); zt = 1; };
  // när man kommer tillbaka från en annan app: plocka upp nyinstallerade och ta bort avinstallerade
  document.addEventListener('visibilitychange', () => { if (!document.hidden && syncNativeApps(false)) buildScene(); });
}
$('#levels').addEventListener('click', e => { const z = e.target.dataset.z; if (!z) return;
  if (path.length) setPath([], -0.4);
  if (level === 0 && +z > 0.5) enterGlobe(frontGlobe());   // från översikten: gå in i den främsta globen
  zt = +z; });
ideaBar.addEventListener('submit', e => { e.preventDefault(); const i = $('#ideaIn'), t = i.value.trim(); if (!t) return;
  const cur = curIdea(); (cur ? kids(cur) : G().ideas).push({ id: uid(), text: t, children: [] });
  i.value = ''; save(); buildScene(); buildMind(); });
$('#bClaude').onclick = openClaude;

const PRESETS = ['#00d8ff', '#3d8bff', '#00ffa2', '#ffb300', '#ff7a1a', '#ff3b4a', '#ff4fd8', '#a66bff', '#e8f4ff'];
$('#bSettings').onclick = () => {
  const sw = el('div', { class: 'swatches' });
  const picker = el('input', { type: 'color', value: state.theme, 'aria-label': 'Egen färg', oninput: e => { setTheme(e.target.value); mark(); } });
  const mark = () => { sw.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === state.theme)); picker.value = state.theme; };
  PRESETS.forEach(c => sw.append(el('button', { class: 'sw', style: `background:${c};color:${c}`, 'data-c': c, 'aria-label': 'Färg ' + c,
    onclick: () => { setTheme(c); mark(); } })));
  sw.append(picker); mark();
  const pl = el('span', { text: state.particles });
  openModal('Inställningar', el('div', {},
    el('p', { class: 'tagline', text: 'V.I.C.T.O.R. · Visionary Interface for Creative Thinking, Organisation & Research' }),
    el('div', { class: 'field' }, el('label', { text: 'Temafärg' }), sw),
    el('div', { class: 'field' }, el('label', { for: 'sName', text: 'Ditt namn' }),
      el('input', { id: 'sName', class: 'in', value: state.name, oninput: e => { state.name = e.target.value.trim(); save(); greet(); } })),
    el('div', { class: 'field' }, el('label', { for: 'sPart' }, 'Antal partiklar · ', pl),
      el('input', { id: 'sPart', type: 'range', min: 1000, max: 10000, step: 250, value: state.particles,
        oninput: e => { pl.textContent = e.target.value; }, onchange: e => { state.particles = +e.target.value; save(); initParticles(); } })),
    el('div', { class: 'field' }, el('label', { class: 'row', style: 'cursor:pointer' },
      el('input', { type: 'checkbox', class: 'chk', checked: state.autoRotate, onchange: e => { state.autoRotate = e.target.checked; save(); } }),
      'Rotera globen automatiskt')),
    NATIVE ? null : el('div', { class: 'field' }, el('span', { class: 'flabel', text: 'Datorbrygga' }),
      el('div', { class: 'row', style: 'align-items:center' }, el('button', { class: 'btn', text: hTok() ? 'Ändra koppling' : 'Koppla datorns program', onclick: () => openHelperSetup() }),
        el('span', { class: 'muted', text: helperOk ? 'Ansluten' : hTok() ? 'Ingen kontakt just nu' : 'Inte kopplad' }))),
    NATIVE ? el('div', { class: 'field' }, el('span', { class: 'flabel', text: 'Startskärm' }),
      el('button', { class: 'btn', text: 'Välj V.I.C.T.O.R. som startskärm', onclick: () => NATIVE.homeSettings() }))
    : el('div', { class: 'field' }, el('span', { class: 'flabel', text: 'Flytta till en annan enhet' }),
      el('div', { class: 'row' },
        el('button', { class: 'btn', text: 'Exportera', onclick: () => {
          const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(state)], { type: 'application/json' })), download: 'victor-backup.json' });
          a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); } }),
        el('label', { class: 'btn', style: 'cursor:pointer' }, 'Importera',
          el('input', { type: 'file', accept: 'application/json,.json', style: 'display:none', onchange: async e => {
            try {
              const s = JSON.parse(await e.target.files[0].text());
              if (!s || !Array.isArray(s.globes)) throw new Error('fel format');
              if (!confirm('Ersätta allt på den här enheten med innehållet i filen?')) return;
              clearTimeout(saveT); localStorage.setItem(KEY, JSON.stringify(s)); location.reload();
            } catch { toast('IMPORT', 'Filen gick inte att läsa.'); } } }))),
      el('p', { class: 'muted', style: 'margin:8px 0 0', text: 'Allt sparas på varje enhet för sig. Exportera här och importera filen på den andra enheten för att ta med appar, widgets och idéer.' })),
    el('div', { class: 'field', style: 'margin:0' }, el('span', { class: 'flabel', text: 'Återställ' }),
      el('button', { class: 'btn danger', text: 'Nollställ allt', onclick: () => {
        if (confirm('Ta bort alla appar, widgets, påminnelser och inställningar och börja om?')) { clearTimeout(saveT); localStorage.removeItem(KEY); location.reload(); } } }))));
};
$('#bFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});

if (NATIVE) syncNativeApps(firstRun);

  openModal('Välkommen till V.I.C.T.O.R.', el('form', { onsubmit: e => { e.preventDefault(); state.name = name.value.trim(); save(); greet(); closeModal(); } },
    el('p', { class: 'tagline', text: 'Visionary Interface for Creative Thinking, Organisation & Research' }),
    el('p', { style: 'margin-top:0', text: 'Ditt eget universum för appar, idéer och påminnelser. Dra i globen för att snurra den, scrolla för att zooma ut till alla globar eller in i en av dem.' }),
    el('div', { class: 'field' }, el('label', { for: 'wName', text: 'Vad ska jag kalla dig?' }), name),
    el('button', { class: 'btn on', text: 'Starta' })));
  name.focus();
}
