<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V.I.C.T.O.R. Spelhall</title>
<style>
  html,body{margin:0;height:100%;background:#02060b;color:#cfe6ef;font:14px "Segoe UI",system-ui,sans-serif;overflow:hidden}
  #game{width:100%;height:100%}
  #msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="game"></div>
<div id="msg">Laddar emulatorn …</div>
<script>
// Spelarsidan körs i en egen webbadress, skild från panelen. Den får bara en spelfil med tidsbegränsad nyckel.
const q = new URLSearchParams(location.search), core = q.get('core'), rom = q.get('rom'), name = q.get('name') || 'spel', bios = q.get('bios');
const CORES = ['psx', 'n64', 'snes', 'nes', 'gba', 'gb', 'nds', 'segaMD', 'segaMS', 'segaGG', 'atari2600'];
const msg = t => document.getElementById('msg').textContent = t;
if (!CORES.includes(core) || !/^[\w.-]+$/.test(rom || '')) msg('Ogiltig länk. Öppna spelet från spelhallen igen.');
else {
  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_gameName = name.replace(/\.[^.]+$/, '');
  window.EJS_gameUrl = '/rom/' + rom + '/' + encodeURIComponent(name);
  if (bios && /^[\w.-]+$/.test(bios)) window.EJS_biosUrl = '/rom/' + bios + '/bios.bin';
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_color = '#00d8ff';
  window.EJS_startOnLoaded = true;
  window.EJS_ready = () => document.getElementById('msg').remove();
  const s = document.createElement('script'); s.src = window.EJS_pathtodata + 'loader.js';
  s.onerror = () => msg('Emulatorn kunde inte hämtas. Kontrollera att enheten har internet.');
  s.onload = () => setTimeout(() => { const m = document.getElementById('msg'); if (m) m.remove(); }, 1500);
  document.body.append(s);
}
</script>
</body>
</html>
